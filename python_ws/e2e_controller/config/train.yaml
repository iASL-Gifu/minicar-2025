# --- データ関連の設定 ---
data_path: "./datasets/"  # データ抽出スクリプトの出力ディレクトリ
resume_ckpt_path: null
# --- データセットと変換の設定 ---
dataset:
  sequence_length: 1
  image_height: 120
  image_width: 160
  transform_mode: "tensor"  # 'numpy'(最速), 'tensor'(高速), 'pil'(低速) から選択

# --- 学習パラメータ ---
training:
  epochs: 50
  batch_size: 64
  learning_rate: 0.0001
  num_workers: 16

# --- モデルのパラメータ ---
model:
  num_outputs: 2

log_dir: ./logs/train/${now:%Y-%m-%d}/${now:%H-%M-%S}  
ckpt_dir: ./ckpts/train/${now:%Y-%m-%d}/${now:%H-%M-%S}  

hydra:
  run:
    dir: ./outputs/train/${now:%Y-%m-%d}/${now:%H-%M-%S}