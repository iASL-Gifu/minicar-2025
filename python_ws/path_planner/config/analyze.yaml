# config/analyze.yaml

# --- パス設定 ---
data_path: "./datasets/test"  # 分析したいデータセット 
ckpt_path: null # 読み込むモデル

load_weights:
  # path_generation で学習した重み
  trajformer_path: null
  # path_follow で学習した重み
  controlnet_path: null

# --- モデルのどの部分を読み込むか ---
# trajformer_only or all
load_part: all # all, trajformer_only, control_only

# --- デバイス ---
device: cuda 

# --- データセット (train.yaml と合わせる) ---
dataset:
  image_height: 120
  image_width: 160
  past_len: 10       
  future_len: 30      

# --- 学習 (Dataloaderの num_workers のために必要) ---
training:
  num_workers: 8

# --- モデル (train.yaml と合わせる) ---
model:
  # --- 共通パラメータ ---
  history_len: 10
  odom_features: 8      # (ご提示の odom_dim)
  future_len: 30

  # --- TrajFormer パラメータ ---
  image_embedding_dim: 128
  motion_embedding_dim: 64         # TrajFormer用 GRUの次元
  transformer_d_model: 192         # TrajFormer用 Transformer (ご提示の d_model)
  transformer_nhead: 6
  transformer_num_layers: 2

  # --- ControlFormer パラメータ (独立GRU構成) ---
  control_motion_embedding_dim: 64 # (★) ControlFormer用 GRUの次元
  control_d_model: 64
  control_nhead: 4
  control_num_layers: 2

analysis:
  select_sequences: [0]  
# --- Hydra (ここですべての出力先が決まる) ---
hydra:
  run:
    dir: ./outputs/analyze/${now:%Y-%m-%d}/${now:%H-%M-%S}